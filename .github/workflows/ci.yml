# Tests that need no GPU, model or vLLM install. The real-vLLM scheduler tests
# (tests/test_scheduler_vllm.py) skip here; scripts/test.sh runs them in the
# pinned vLLM container.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pure-Python tests
        run: python -m unittest discover -s tests -t . -v

  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
