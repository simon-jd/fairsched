[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairsched"
version = "0.1.0"
description = "Fair multi-tenant scheduling (VTC) as a vLLM 0.31.0 scheduler plugin"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = ["vllm==0.31.0"]

[tool.setuptools.packages.find]
include = ["fairsched*", "bench*"]
